# Database migrations. The database URL is not here: env.py reads
# EXPENSES_DATABASE_URL (environment or .env), the same setting the server uses.
#
#   uv run alembic upgrade head                       apply all migrations
#   uv run alembic revision -m "add something"        new empty migration
#   uv run alembic current                            show the applied version

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
