[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP server for tracking personal expenses in ILS with PostgreSQL"
readme = "README.md"
authors = [
    { name = "asaf-sardas", email = "asafsardas1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastmcp>=4.1.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
]

[project.scripts]
mcp-server = "mcp_server.expenses_tracker.server:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
